# Integración continua: en cada push y pull request revisa la configuración,
# que no falten migraciones y que pasen todas las pruebas, contra un
# PostgreSQL 16 limpio (nunca contra la base de una clínica).
name: CI

on:
  push:
  pull_request:

jobs:
  revisar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pradospets
        ports:
          - 5432:5432
        # Espera a que PostgreSQL acepte conexiones antes de seguir.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_NAME: pradospets
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt

      - name: Revisar la configuración de Django
        run: python manage.py check

      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Correr las pruebas
        run: python manage.py test
