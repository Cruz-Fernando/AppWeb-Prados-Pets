<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comprobante Peluquería – {{ mascota.nombre }}</title>
  <style>
    @page {
      size: A5 portrait;
      margin: 1cm 1.2cm 1cm 1.2cm;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 10.5px;
      color: #1e1e2d;
      background: #ffffff;
    }

    /* ─ CABECERA ─ */
    .header {
      background-color: #6d28d9;
      padding: 12px 14px 10px 14px;
      border-radius: 6px;
      margin-bottom: 0;
    }
    .header table { width: 100%; border-collapse: collapse; }
    .header td { vertical-align: middle; }
    .brand-name {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 0.4px;
    }
    .brand-sub {
      font-size: 8.5px;
      color: rgba(255,255,255,0.75);
      margin-top: 2px;
    }
    .doc-badge {
      background-color: rgba(255,255,255,0.2);
      color: #ffffff;
      font-size: 8.5px;
      padding: 3px 10px;
      border-radius: 20px;
      text-align: right;
      float: right;
    }

    /* ─ DIVIDER ─ */
    .divider {
      height: 3px;
      background-color: #7c3aed;
      margin-bottom: 10px;
    }

<table><tr>
  <td class="col col-izq sec">
    <h2>Mascota</h2>
    <table class="datos">
      <tr><td class="k">Nombre</td><td class="v">{{ mascota.nombre|default:cita.nombre_mascota }}</td></tr>
      {% if mascota %}
      <tr><td class="k">Código</td><td class="v">{{ mascota.codigo_mascota }}</td></tr>
      <tr><td class="k">Especie</td><td class="v">{{ mascota.get_especie_display }}</td></tr>
      {% endif %}
      <tr><td class="k">Raza</td><td class="v">{{ cita.raza|default:"No especificada" }}</td></tr>
      {% if cita.condicion_pelaje %}<tr><td class="k">Condición del pelaje</td><td class="v">{{ cita.condicion_pelaje }}</td></tr>{% endif %}
    </table>
  </div>
  <div class="divider"></div>

  <!-- MASCOTA + PROPIETARIO -->
  <table class="info-table">
    <tr>
      <td>
        <div class="section-title">Datos de la Mascota</div>
        <table class="data-table">
          <tr>
            <td class="data-lbl">Nombre</td>
            <td class="data-val">{{ mascota.nombre }}</td>
          </tr>
          <tr>
            <td class="data-lbl">Tipo</td>
            <td class="data-val">
              <span class="badge">{{ mascota.get_especie_display }}</span>
            </td>
          </tr>
          <tr>
            <td class="data-lbl">Raza</td>
            <td class="data-val">{{ mascota.raza|default:"No especificada" }}</td>
          </tr>
          <tr>
            <td class="data-lbl">Tamaño</td>
            <td class="data-val">{{ cita.tamano|capfirst }}</td>
          </tr>
        </table>
      </td>
      <td>
        <div class="section-title">Datos del Propietario</div>
        <table class="data-table">
          <tr>
            <td class="data-lbl">Nombre</td>
            <td class="data-val">{{ mascota.id_dueno.nombre_completo }}</td>
          </tr>
          <tr>
            <td class="data-lbl">Teléfono</td>
            <td class="data-val">{{ mascota.id_dueno.telefono }}</td>
          </tr>
          <tr>
            <td class="data-lbl">Dirección</td>
            <td class="data-val">{{ mascota.id_dueno.direccion|default:"-" }}</td>
          </tr>
          <tr>
            <td class="data-lbl">Código</td>
            <td class="data-val">{{ mascota.codigo_mascota }}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

  <!-- SERVICIO -->
  <div class="section-title">Servicio Agendado</div>
  <div class="service-box">
    <div class="service-name">{{ cita.get_servicio_display }}</div>
    <table class="service-meta">
      <tr>
        <td>Fecha: <strong>{{ cita.fecha_hora|date:"d/m/Y" }}</strong></td>
        <td>Hora: <strong>{{ cita.fecha_hora|date:"H:i" }}</strong></td>
        <td>Duración: <strong>{{ cita.duracion_estimada_min }} min</strong></td>
      </tr>
    </table>
  </div>

  <!-- PRECIO -->
  <table class="price-box">
    <tr>
      <td class="price-lbl">Total a pagar</td>
      <td class="price-val">{{ cita.precio_formateado }}</td>
    </tr>
  </table>

  <!-- OBSERVACIONES -->
  <div class="section-title">Observaciones</div>
  <div class="obs-box">{{ cita.observaciones|default:"Sin observaciones adicionales." }}</div>

  <!-- FOOTER -->
  <div class="footer">
    Gracias por confiar en <b>Prados Pets</b> para el cuidado de {{ mascota.nombre }}.
    Este comprobante es válido como recibo de agendamiento.
  </div>

</body>
</html>
