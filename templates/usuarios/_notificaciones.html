{% comment %}
  Campana de notificaciones. Se incluye junto al menú lateral, así aparece en
  todas las pantallas internas. El contenido lo carga static/js/notificaciones.js.
{% endcomment %}
{% if user.is_authenticated %}
<div class="notif" id="notif" data-url="{% url 'usuarios:notificaciones' %}">
  <button type="button" class="notif-boton" id="notif-boton" aria-expanded="false" aria-controls="notif-panel" aria-haspopup="dialog">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="sr-only" id="notif-etiqueta">Notificaciones</span>
    <span class="notif-burbuja" id="notif-burbuja" aria-hidden="true" hidden></span>
  </button>
  <div class="notif-panel" id="notif-panel" role="dialog" aria-labelledby="notif-titulo" hidden>
    <p class="notif-vacio" id="notif-titulo">Cargando notificaciones…</p>
  </div>
</div>
{% endif %}
